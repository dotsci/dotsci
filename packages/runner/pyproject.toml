[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dotsci-runner"
version = "0.1.0"
description = "Toolkit for DotSci runners and challengers: manifest validation, input hash checks, tolerance comparison, and JSONL logging."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["jsonschema>=4.20"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dotsci-runner = "dotsci_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dotsci_runner = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
