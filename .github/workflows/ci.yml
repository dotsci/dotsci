name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  runner-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: packages/runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest

  conformance-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/runner -e packages/protocol
      - name: Vectors are up to date
        run: python tools/gen_vectors.py --check
      - name: Independent verifier reproduces them
        run: python spec/vectors/verify.py

  verify-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test
        working-directory: packages/verify-js
        run: node --test test/*.test.js
      - name: Single file bundle is current and passes the vectors
        working-directory: packages/verify-js
        run: |
          node scripts/bundle.mjs --check
          DOTSCI_VERIFY_ENTRY=../dist/dotsci-verify.mjs node --test test/vectors.test.js

  protocol-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: packages/protocol
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest
